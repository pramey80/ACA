<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Judges Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap wide">
  <nav><b>Judges Dashboard</b><a href="/">&larr; Registration</a></nav>

  <div id="login" class="card hidden" style="max-width:380px">
    <h1>Judges login</h1>
    <p class="sub">Enter the judges' passcode.</p>
    <form id="lf"><input id="pass" type="password" placeholder="Passcode" required>
      <div id="lerr" class="msg err hidden">Wrong passcode</div>
      <button>Open dashboard</button></form>
  </div>

  <div id="app" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs"></div>
    <div class="toolbar noprint">
      <input id="q" placeholder="Search team, member, email, area...">
      <button class="ghost" id="csv">Download CSV</button>
      <button class="ghost" onclick="window.print()">Print</button>
      <button class="ghost" id="refresh">Refresh</button>
      <button class="danger" id="reset">Reset all</button>
    </div>
    <div class="card scroll">
      <table>
        <thead><tr><th>#</th><th>Team</th><th>Members</th><th>Area</th><th>Table</th><th>Panel</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="sub hidden" style="padding:14px 0 0">No teams here yet.</p>
    </div>
    <h3 style="margin-top:28px">Table map <span class="sub" style="font-size:13px">(highlighted = taken)</span></h3>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
let pass = sessionStorage.getItem('pass') || '';
let data = null, tab = 'all';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function load() {
  const r = await fetch('/api/teams', { headers: { 'x-passcode': pass }, cache: 'no-store' });
  if (r.status === 401) {
    $('app').classList.add('hidden'); $('login').classList.remove('hidden');
    if (pass) $('lerr').classList.remove('hidden');
    return;
  }
  const j = await r.json();
  if (!r.ok) { alert(j.error); return; }
  data = j;
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  render();
}

function visible() {
  const q = $('q').value.trim().toLowerCase();
  return data.teams.filter((t) =>
    (tab === 'all' || t.panel === Number(tab)) &&
    (!q || [t.teamName, t.member1Name, t.member2Name, t.email1, t.email2, t.area].join(' ').toLowerCase().includes(q)));
}

function render() {
  const n = data.teams.length;
  $('stats').innerHTML =
    `<div class="stat"><b>${n}</b><span>Teams registered</span></div>` +
    `<div class="stat"><b>${data.totalTables - n}</b><span>Tables free</span></div>` +
    Object.entries(data.panelCounts).map(([p, c]) => `<div class="stat"><b>${c}</b><span>Panel ${p}</span></div>`).join('');
  $('tabs').innerHTML = [['all', `All (${n})`]].concat(Object.entries(data.panelCounts).map(([p, c]) => [p, `Panel ${p} (${c})`]))
    .map(([k, label]) => `<button class="tab ${String(tab) === String(k) ? 'on' : ''}" data-k="${k}">${label}</button>`).join('');
  document.querySelectorAll('.tab').forEach((b) => b.onclick = () => { tab = b.dataset.k; render(); });
  const list = visible();
  $('rows').innerHTML = list.map((t) => `<tr>
    <td>${t.id}</td><td><b>${esc(t.teamName)}</b></td>
    <td>${esc(t.member1Name)}<br><span class="sub">${esc(t.email1)}</span><br>${esc(t.member2Name)}<br><span class="sub">${esc(t.email2)}</span></td>
    <td>${esc(t.area)}</td><td><b>${t.table}</b></td><td>Panel ${t.panel}</td></tr>`).join('');
  $('empty').classList.toggle('hidden', list.length > 0);
  const used = new Set(data.teams.map((t) => t.table));
  $('grid').innerHTML = Array.from({ length: data.totalTables }, (_, i) => i + 1)
    .map((i) => `<div class="cell ${used.has(i) ? 'used' : ''}">${i}</div>`).join('');
}

$('lf').onsubmit = (e) => { e.preventDefault(); pass = $('pass').value; sessionStorage.setItem('pass', pass); load(); };
$('q').oninput = () => data && render();
$('refresh').onclick = load;
$('csv').onclick = () => {
  const rows = [['ID', 'Team', 'Member1', 'Email1', 'Member2', 'Email2', 'Area', 'Table', 'Panel']]
    .concat(visible().map((t) => [t.id, t.teamName, t.member1Name, t.email1, t.member2Name, t.email2, t.area, t.table, t.panel]));
  const csv = rows.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `teams-${tab === 'all' ? 'all' : 'panel' + tab}.csv`; a.click();
};
$('reset').onclick = async () => {
  if (!confirm('Delete ALL registrations and free all tables? This cannot be undone.')) return;
  const r = await fetch('/api/reset', { method: 'POST', headers: { 'x-passcode': pass } });
  const j = await r.json();
  if (!r.ok) return alert(j.error);
  load();
};
setInterval(() => data && load(), 15000);
load();
</script>
</body>
</html>
